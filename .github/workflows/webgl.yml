name: WebGL build and deploy

# Сборка идёт на GitHub-hosted раннере через game-ci: редактор поднимается в
# контейнере unityci/editor и активируется лицензией из секретов
# (Personal: UNITY_EMAIL + UNITY_PASSWORD).
#
# Свой buildMethod обязателен: FrostSpace.Editor.BuildWebGL.PerformBuild
# выставляет PlayerSettings.WebGL (Brotli + decompressionFallback, шаблон
# PROJECT:FrostSpace). Без decompressionFallback браузер не распакует .unityweb —
# GitHub Pages не отдаёт Content-Encoding.
#
# Контракт вывода: game-ci проверяет stdout Unity и считает сборку успешной
# только если там есть «Build succeeded!» или блок «# Build results #» с
# «Errors: N». Свой buildMethod заменяет штатный скрипт билдера, поэтому оба
# маркера печатает сам BuildWebGL. Прогон 39409178978 собрал 13 МБ и вышел с
# кодом 0, но упал на этой проверке — тогда маркеров не было.
#
# Library НЕ кэшируется сознательно. Прогон 39406577398 упал с exit code 137
# (SIGKILL — сработал OOM-killer контейнера) через 2.5 с после старта билда:
# actions/cache восстановил Library от другого коммита (точный ключ не совпал,
# сработал restore-keys), Unity пошла переимпортом поверх чужих артефактов и
# упёрлась в лимит памяти (--memory ≈ 95% от 16 ГБ раннера). Холодный импорт
# без кэша проходил стабильно, поэтому каждый билд импортирует свой Library
# с нуля — это ~5 минут на текущем объёме ассетов, зато воспроизводимо.
#
# Тайминг прогона 39471457223 (job 20m28s) после перехода на OptimizeSize +
# stripping Medium: установка ~2.5 мин, импорт ассетов 304 с, сборка 750 с
# (из них Postprocess built player 597 с, Writing asset files 103 с,
# ProducePlayerScriptAssemblies 36 с). До этого было 28m16s и 1205 с сборки.
# Ускорять дальше можно раннером на 8 ядер (IL2CPP параллелится по ядрам) или
# кэшем Library — второе упирается в OOM выше.
#
# Версии закреплены намеренно:
# - runs-on: ubuntu-24.04, не ubuntu-latest. С 2026-10-19 метка latest
#   переезжает на Ubuntu 26; переезд под unityci/editor не проверен, а сборка
#   занимает полчаса — такие сюрпризы не нужны. Менять осознанно.
# - game-ci/unity-builder@v6 ставит CLI из релиза «latest», если не задан
#   cliVersion. v0.1.72 — версия, на которой сборка отработала; новая версия
#   CLI может снова поменять правила валидации.
# - actions/checkout v7.0.1, actions/upload-pages-artifact v5.0.0,
#   actions/deploy-pages v5.0.1 — сверено с апстримом 2026-10-20.
#
# Секрета UNITY_LICENSE здесь нет: .ulf привязан к машине, на которой выпущен
# (Windows-ПК), и в контейнере даёт «Machine bindings don't match». game-ci
# откатывается на активацию по email/паролю — то есть .ulf только добавляет
# неудачную попытку и предупреждение в лог.
#
# Раньше сборка шла на self-hosted раннере этого ПК: ПК должен был быть включён,
# иначе job висел в очереди, а Unity брался уже активированным. Подробности —
# docs/DEPLOY.md.

on:
  push:
    branches: [main]
    # Правка документации не должна занимать полчаса CI и не меняет сборку.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Один прогон на группу: два пуша подряд не должны собираться по очереди
# (20 минут каждый). Новый пуш отменяет и текущую сборку, и стоящие в очереди —
# на страницу уедет только последний коммит. Deploy идёт 12 секунд, поэтому
# отмена задевает его крайне редко; если такое случится, Pages остаётся на
# предыдущей версии.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build WebGL
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Build WebGL
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          # auto = версия из ProjectSettings/ProjectVersion.txt (6000.6.6f1):
          # расхождение проекта и контейнера невозможно.
          unityVersion: auto
          # Релиз game-ci CLI. Не «latest»: правило валидации вывода живёт в CLI.
          cliVersion: v0.1.72
          projectPath: .
          # Совпадает с путями внутри BuildWebGL.PerformBuild.
          buildsPath: Builds
          buildName: WebGL
          buildMethod: FrostSpace.Editor.BuildWebGL.PerformBuild
          # Builds/ в .gitignore, но результат сборки делает рабочее дерево
          # «грязным» для проверок билдера — разрешаем явно.
          allowDirtyBuild: true
          # Версионированием занимается дефолтный скрипт билдера, у нас свой метод.
          versioning: None

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: Builds/WebGL

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
