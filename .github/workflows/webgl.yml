name: WebGL build and deploy

# Сборка идёт на GitHub-hosted раннере через game-ci: редактор поднимается в
# контейнере unityci/editor и активируется лицензией из секретов
# (Personal: UNITY_LICENSE + UNITY_EMAIL + UNITY_PASSWORD).
#
# Свой buildMethod обязателен: FrostSpace.Editor.BuildWebGL.PerformBuild
# выставляет PlayerSettings.WebGL (Brotli + decompressionFallback, шаблон
# PROJECT:FrostSpace). Без decompressionFallback браузер не распакует .unityweb —
# GitHub Pages не отдаёт Content-Encoding.
#
# Раньше сборка шла на self-hosted раннере этого ПК: ПК должен был быть включён,
# иначе job висел в очереди, а Unity брался уже активированным. Подробности —
# docs/DEPLOY.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Кэш импорта. Без него каждый прогон заново импортирует 39 FBX,
      # 20 префабов и все материалы — минуты впустую.
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/packages-lock.json', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          # auto = версия из ProjectSettings/ProjectVersion.txt (6000.6.6f1):
          # расхождение проекта и контейнера невозможно.
          unityVersion: auto
          projectPath: .
          # Совпадает с путями внутри BuildWebGL.PerformBuild.
          buildsPath: Builds
          buildName: WebGL
          buildMethod: FrostSpace.Editor.BuildWebGL.PerformBuild
          # Builds/ в .gitignore, но результат сборки делает рабочее дерево
          # «грязным» для проверок билдера — разрешаем явно.
          allowDirtyBuild: true
          # Версионированием занимается дефолтный скрипт билдера, у нас свой метод.
          versioning: None

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Builds/WebGL

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
