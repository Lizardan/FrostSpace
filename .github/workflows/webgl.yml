name: WebGL build and deploy

# Сборка идёт на self-hosted раннере этого ПК: он использует уже активированный
# Unity 6000.6.6f1 и не требует лицензии в облаке (у Unity 6 нет .ulf, который
# ждёт game-ci). Публикация — штатными действиями GitHub Pages.
#
# Важно: Unity.exe на Windows — лончер, он завершается сразу с кодом 1, а реальный
# редактор продолжает работу. Поэтому ждём не код возврата, а файл
# Builds/webgl-result.json, который пишет BuildWebGL.PerformBuild.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build WebGL
    runs-on: [self-hosted, Windows, X64, unity]
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: |
          $unity = "F:\Unity\Editor\6000.6.6f1\Editor\Unity.exe"
          if (-not (Test-Path $unity)) { throw "Unity не найден: $unity" }

          $ws = "${{ github.workspace }}"
          $log = Join-Path $ws "build-webgl.log"
          $result = Join-Path $ws "Builds\webgl-result.json"
          if (Test-Path $result) { Remove-Item $result -Force }

          Write-Host "Unity: $unity"
          Write-Host "Project: $ws"

          $args = @(
            "-quit", "-batchmode",
            "-projectPath", $ws,
            "-buildTarget", "WebGL",
            "-executeMethod", "FrostSpace.Editor.BuildWebGL.PerformBuild",
            "-logFile", $log
          )
          Start-Process -FilePath $unity -ArgumentList $args -PassThru | Out-Null

          $deadline = (Get-Date).AddMinutes(60)
          while (-not (Test-Path $result)) {
            if ((Get-Date) -gt $deadline) {
              if (Test-Path $log) { Get-Content $log -Tail 120 }
              throw "Unity не записал результат за 60 минут"
            }
            Start-Sleep -Seconds 5
          }
          Start-Sleep -Seconds 3

          $json = Get-Content $result -Raw
          Write-Host "Результат сборки: $json"
          $data = $json | ConvertFrom-Json
          if ($data.result -ne "Succeeded") {
            if (Test-Path $log) { Get-Content $log -Tail 120 }
            throw "Сборка не удалась: $($data.message)"
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webgl-build-log
          path: build-webgl.log
          if-no-files-found: ignore

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Builds/WebGL

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
